blacklist nouveau
options nouveau modeset=0
# NVreg_EnableGpuFirmware=0 avoids GSP rwlock/ACPI deadlocks on hybrid laptops;
# NVreg_DynamicPowerManagement=0x02 enables fine-grained PCIe RTD3 (D3cold) sleep.
options nvidia NVreg_EnableGpuFirmware=0 NVreg_DynamicPowerManagement=0x02
options nvidia_drm modeset=1 fbdev=0
