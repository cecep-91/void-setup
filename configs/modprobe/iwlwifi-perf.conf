# Universal Intel Wi-Fi (iwlwifi/iwlmvm) low-latency stability tuning.
# Ignored cleanly by the kernel on non-Intel wireless chipsets.
# - power_save=0 & uapsd_disable=1: prevents radio beacon-sleep stalls
# - iwlmvm power_scheme=1: firmware Active mode (eliminates balanced-mode 200-1000ms spikes)
options iwlwifi power_save=0 uapsd_disable=1
options iwlmvm power_scheme=1
