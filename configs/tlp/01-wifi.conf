# Keep Wi-Fi and PCIe NICs awake on AC and battery to prevent ping spikes.
# "+=" keeps TLP's built-in driver denylist and merges with 04-audio-perf.conf.
WIFI_PWR_ON_BAT=off
WIFI_PWR_ON_AC=off
RUNTIME_PM_DRIVER_DENYLIST+=" iwlwifi ath9k ath10k_pci ath11k_pci ath12k rtw88_pci rtw89_pci mt7921e mt7925e r8169 e1000e igc"
