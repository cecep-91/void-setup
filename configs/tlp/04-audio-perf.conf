# Keep built-in HDA microphone/codec (via udev 82-audio-perf.rules) and USB audio DACs
# at full performance WITHOUT blocking NVIDIA HDMI audio (01:00.1) from D3cold sleep.
# SOUND_POWER_SAVE_ON_*=1 + CONTROLLER=Y lets idle NVIDIA HDMI codecs suspend in 1s,
# while udev pins all non-NVIDIA PCI audio controllers and HDA codecs to power/control=on.
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
RUNTIME_PM_DRIVER_DENYLIST+=" snd_hda_intel"
USB_EXCLUDE_AUDIO=1
